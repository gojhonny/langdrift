name: langdrift-early-access-dev
services:
  nats:
    build:
      context: ../../../../..
      dockerfile: messaging/infrastructure/broker/nats/Dockerfile
    env_file:
      - ../../../../infrastructure/broker/nats/.env.development
      - ../../../../infrastructure/broker/nats/.env
    volumes:
      - jetstream:/data/jetstream
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8222/healthz?js-enabled-only=true']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    build:
      context: ../../../../..
      dockerfile: messaging/infrastructure/storage/minio/Dockerfile
    env_file:
      - ../../../../infrastructure/storage/minio/.env.development
      - ../../../../infrastructure/storage/minio/.env
    volumes:
      - contacts:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  email-store:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    build:
      context: ../../../../..
      dockerfile: messaging/runtime/early-access/microservices/email-store/Dockerfile
    env_file:
      - ../../microservices/email-store/.env.development
      - ../../microservices/email-store/.env
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 12s
  email-sender:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    build:
      context: ../../../../..
      dockerfile: messaging/runtime/early-access/microservices/email-sender/Dockerfile
    env_file:
      - ../../microservices/email-sender/.env.development
      - ../../microservices/email-sender/.env
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      email-store:
        condition: service_healthy
      resend-mock:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8081/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 12s
  resend-mock:
    build:
      context: ../../../../..
      dockerfile: messaging/runtime/early-access/containers/e2e/resend-mock/Dockerfile
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  jetstream:
  contacts:
