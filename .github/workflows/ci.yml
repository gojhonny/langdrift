name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  repository:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3001
      NEXT_PUBLIC_DOCS_URL: http://localhost:3004
      NEXT_PUBLIC_SSO_URL: http://localhost:3002
      NEXT_PUBLIC_SITE_URL: http://localhost:3004
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/callback
      EMAIL_SERVICE_URL: http://localhost:8080
      EMAIL_SERVICE_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: ./cli/drift doctor --ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Require gofmt
        run: |
          files=$(gofmt -l packages/events messaging/runtime/early-access)
          [ -z "$files" ] || { printf '%s\n' "$files"; exit 1; }

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - apps/website/Dockerfile
          - apps/dashboard/Dockerfile
          - apps/sso/Dockerfile
          - apps/docs/Dockerfile
          - messaging/infrastructure/broker/nats/Dockerfile
          - messaging/infrastructure/storage/minio/Dockerfile
          - messaging/runtime/early-access/microservices/email-store/Dockerfile
          - messaging/runtime/early-access/microservices/email-sender/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Supply safe image build configuration
        run: |
          cat > /tmp/langdrift-build.env <<'ENV'
          NEXT_TELEMETRY_DISABLED=1
          NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3001
          NEXT_PUBLIC_DOCS_URL=http://localhost:3004
          NEXT_PUBLIC_SSO_URL=http://localhost:3002
          NEXT_PUBLIC_SITE_URL=http://localhost:3004
          NEXT_PUBLIC_WEBSITE_URL=http://localhost:3000
          NEXT_PUBLIC_WORKOS_REDIRECT_URI=http://localhost:3002/callback
          EMAIL_SERVICE_URL=http://localhost:8080
          EMAIL_SERVICE_API_KEY=ci-placeholder
          ENV
      - name: Build image
        run: docker build --secret id=build_env,src=/tmp/langdrift-build.env --file '${{ matrix.dockerfile }}' .

  early-access-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supply disposable runtime secrets
        shell: bash
        run: |
          set -eu
          : > messaging/infrastructure/broker/nats/.env
          cat > messaging/infrastructure/storage/minio/.env <<'ENV'
          MINIO_ROOT_USER=ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-secret
          ENV
          cat > messaging/runtime/early-access/microservices/email-store/.env <<'ENV'
          EMAIL_SERVICE_API_KEY=ci-email-service-key
          MINIO_ACCESS_KEY=ci-minio
          MINIO_SECRET_KEY=ci-minio-secret
          ENV
          cat > messaging/runtime/early-access/microservices/email-sender/.env <<'ENV'
          RESEND_API_KEY=re_ci_placeholder
          RESEND_FROM=ci@example.invalid
          ENV
          cat > messaging/runtime/early-access/containers/e2e/.env <<'ENV'
          MINIO_ROOT_USER=ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-secret
          EMAIL_SERVICE_API_KEY=ci-email-service-key
          MINIO_ACCESS_KEY=ci-minio
          MINIO_SECRET_KEY=ci-minio-secret
          RESEND_API_KEY=re_ci_placeholder
          RESEND_FROM=ci@example.invalid
          ENV
      - name: Validate Compose models
        run: |
          docker compose -f messaging/runtime/early-access/containers/dev/docker-compose.yml config --quiet
          docker compose -f messaging/runtime/early-access/containers/e2e/docker-compose.yml config --quiet
      - name: Raise development runtime
        shell: bash
        run: |
          set -euo pipefail
          compose='docker compose -f messaging/runtime/early-access/containers/dev/docker-compose.yml'
          trap "$compose down -v --remove-orphans" EXIT
          $compose up -d --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz | grep -Fq '"status":"ok"'
          $compose exec -T nats sh -ec \
            "wget -q -O - 'http://127.0.0.1:8222/jsz?streams=true&consumers=true' | grep -q EARLY_ACCESS"
          $compose down -v --remove-orphans
          trap - EXIT
      - name: Raise isolated E2E topology
        shell: bash
        run: |
          set -euo pipefail
          compose='docker compose -f messaging/runtime/early-access/containers/e2e/docker-compose.yml'
          trap "$compose down -v --remove-orphans" EXIT
          $compose up -d --build --wait
          $compose ps
          $compose down -v --remove-orphans
          trap - EXIT
