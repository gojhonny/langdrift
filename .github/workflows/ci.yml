name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  repository:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3001
      NEXT_PUBLIC_DOCS_URL: http://localhost:3004
      NEXT_PUBLIC_SSO_URL: http://localhost:3002
      NEXT_PUBLIC_SITE_URL: http://localhost:3004
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3002/callback
      EMAIL_SERVICE_URL: http://localhost:8080
      EMAIL_SERVICE_API_KEY: ci-placeholder
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      TURNSTILE_EXPECTED_HOSTNAME: localhost
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      EARLY_ACCESS_MODE: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: ./cli/drift doctor --ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Require gofmt
        run: |
          files=$(gofmt -l packages/events messaging/runtime/early-access)
          [ -z "$files" ] || { printf '%s\n' "$files"; exit 1; }

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - apps/website/Dockerfile
          - apps/dashboard/Dockerfile
          - apps/sso/Dockerfile
          - messaging/infrastructure/broker/nats/Dockerfile
          - messaging/infrastructure/storage/minio/Dockerfile
          - messaging/runtime/early-access/microservices/email-store/Dockerfile
          - messaging/runtime/early-access/microservices/email-sender/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Supply safe image build configuration
        run: |
          cat > /tmp/langdrift-build.env <<'ENV'
          NEXT_TELEMETRY_DISABLED=1
          NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3001
          NEXT_PUBLIC_DOCS_URL=http://localhost:3004
          NEXT_PUBLIC_SSO_URL=http://localhost:3002
          NEXT_PUBLIC_SITE_URL=http://localhost:3004
          NEXT_PUBLIC_WEBSITE_URL=http://localhost:3000
          NEXT_PUBLIC_WORKOS_REDIRECT_URI=http://localhost:3002/callback
          EMAIL_SERVICE_URL=http://localhost:8080
          EMAIL_SERVICE_API_KEY=ci-placeholder
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          TURNSTILE_EXPECTED_HOSTNAME=localhost
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          EARLY_ACCESS_MODE=test
          ENV
      - name: Build image
        run: docker build --secret id=build_env,src=/tmp/langdrift-build.env --file '${{ matrix.dockerfile }}' .

  early-access-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir messaging/runtime/early-access/e2e exec playwright install --with-deps chromium
      - name: Prove Early Access with the shared runners
        run: |
          ./cli/drift early-access setup
          ./cli/drift doctor early-access
          mkdir -p .audits/runs/ci
          EARLY_ACCESS_AUDIT_DIR="$GITHUB_WORKSPACE/.audits/runs/ci" ./cli/drift test early-access all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: early-access-coverage
          if-no-files-found: ignore
          path: |
            .audits/runs/ci
            coverage
