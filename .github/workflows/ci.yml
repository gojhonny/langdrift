name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Repository scaffolds are being restructured; check application code directly.
      - run: pnpm lint
      - run: pnpm typecheck
      # The website fails fast on missing NEXT_PUBLIC_* (see
      # apps/docs/content/decisions/2026-09-20-environment-variables-fail-fast.mdx).
      # Build-safe values are set here explicitly instead of weakening that check.
      - run: pnpm build
        env:
          NEXT_PUBLIC_DOCS_URL: http://localhost:3004
          NEXT_PUBLIC_SSO_URL: http://localhost:3002
      - run: ./cli/drift verify packages
